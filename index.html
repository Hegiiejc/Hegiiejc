<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S-Rank Hunter Profile</title>
    <style>
        /* === БАЗОВЫЕ НАСТРОЙКИ И ЦВЕТА === */
        :root {
            --bg-dark: #1a0505;
            --bg-bordeaux: #4a0404;
            --sakura-light: #ffc0cb;
            --sakura-pink: #ff69b4;
            --gold: #ffd700;
            --text-main: #e0e0e0;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Courier New', Courier, monospace; /* Системный шрифт */
            background: radial-gradient(circle at center, var(--bg-bordeaux), var(--bg-dark));
            color: var(--text-main);
            overflow-x: hidden;
        }

        /* === CANVAS ДЛЯ ЛЕПЕСТКОВ === */
        #sakura-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Чтобы можно было кликать сквозь лепестки */
            z-index: 1;
        }

        /* === КОНТЕЙНЕР КОНТЕНТА === */
        .container {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }

        /* === СИСТЕМНОЕ ОКНО (Solo Leveling Style) === */
        .system-window {
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px var(--gold);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 5px;
            animation: fadeIn 1.5s ease-in-out;
        }

        .system-header {
            color: var(--gold);
            font-weight: bold;
            border-bottom: 1px solid var(--gold);
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        h1 {
            font-size: 2.5rem;
            margin: 10px 0;
            text-shadow: 0 0 10px var(--sakura-pink);
        }

        .rank-badge {
            display: inline-block;
            background: var(--bg-bordeaux);
            color: var(--gold);
            padding: 5px 15px;
            border: 1px solid var(--gold);
            font-weight: bold;
            margin-top: 10px;
        }

        /* === СТАТИСТИКА === */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .stat-card {
            background: rgba(74, 4, 4, 0.6);
            border: 1px solid var(--sakura-pink);
            padding: 15px;
            transition: transform 0.3s;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 10px var(--sakura-pink);
        }

        .stat-value {
            font-size: 1.5rem;
            color: var(--gold);
            font-weight: bold;
        }

        /* === АНИМАЦИЯ ПОЯВЛЕНИЯ === */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* === КНОПКИ СОЦСЕТЕЙ === */
        .social-links a {
            color: var(--sakura-light);
            text-decoration: none;
            margin: 0 10px;
            font-size: 1.2rem;
            border-bottom: 1px dashed var(--sakura-light);
        }
        
        .social-links a:hover {
            color: var(--gold);
            border-color: var(--gold);
        }
    </style>
</head>
<body>

    <!-- Холст для анимации сакуры -->
    <canvas id="sakura-canvas"></canvas>

    <div class="container">
        <!-- Системное уведомление -->
        <div class="system-window">
            <div class="system-header">[ SYSTEM NOTIFICATION ]</div>
            <h1>ВАШЕ ИМЯ</h1>
            <div class="rank-badge">S-RANK HUNTER</div>
            <p>"Я не ищу сильных врагов. Я сам становлюсь силой."</p>
        </div>

        <!-- Основной контент -->
        <div class="content">
            <p>Full-Stack Developer | Python Enthusiast | Shadow Monarch</p>
            
            <div class="stats-grid">
                <div class="stat-card">
                    <div>Projects Completed</div>
                    <div class="stat-value">42</div>
                </div>
                <div class="stat-card">
                    <div>Lines of Code</div>
                    <div class="stat-value">∞</div>
                </div>
                <div class="stat-card">
                    <div>Current Level</div>
                    <div class="stat-value">99</div>
                </div>
            </div>

            <br><br>
            <div class="social-links">
                <a href="#">GitHub</a>
                <a href="#">Telegram</a>
                <a href="#">LinkedIn</a>
            </div>
        </div>
    </div>

    <script>
        // === СКРИПТ АНИМАЦИИ САКУРЫ ===
        const canvas = document.getElementById('sakura-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        let petals = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        window.addEventListener('resize', resize);
        resize();

        class Petal {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height - height;
                this.size = Math.random() * 5 + 5;
                this.speedY = Math.random() * 1 + 0.5;
                this.speedX = Math.random() * 2 - 1;
                this.rotation = Math.random() * 360;
                this.rotationSpeed = Math.random() * 2 - 1;
                this.color = `rgba(255, ${192 + Math.random() * 50}, ${203 + Math.random() * 50}, ${Math.random() * 0.5 + 0.3})`;
            }

            update() {
                this.y += this.speedY;
                this.x += Math.sin(this.y / 50) * 0.5 + this.speedX * 0.2;
                this.rotation += this.rotationSpeed;

                if (this.y > height) {
                    this.y = -10;
                    this.x = Math.random() * width;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.rotation * Math.PI / 180);
                ctx.fillStyle = this.color;
                
                // Рисуем форму лепестка
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(this.size / 2, -this.size / 2, this.size, 0, 0, this.size);
                ctx.bezierCurveTo(-this.size, 0, -this.size / 2, -this.size / 2, 0, 0);
                ctx.fill();
                
                ctx.restore();
            }
        }

        // Создаем лепестки
        for (let i = 0; i < 50; i++) {
            petals.push(new Petal());
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            petals.forEach(petal => {
                petal.update();
                petal.draw();
            });
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
